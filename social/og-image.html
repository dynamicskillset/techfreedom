<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css?family=fraunces:300,300i,400,400i,600,700|dm-sans:400,500,600,700" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 1200px;
  height: 630px;
  background: #F7F5F0;
  font-family: 'DM Sans', sans-serif;
  overflow: hidden;
  position: relative;
}

body::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 120% 80% at 30% 20%, rgba(74, 144, 217, 0.06) 0%, transparent 60%),
    radial-gradient(ellipse 100% 60% at 80% 60%, rgba(212, 168, 67, 0.04) 0%, transparent 50%),
    linear-gradient(180deg, #F7F5F0 0%, #F0EDE5 100%);
  z-index: 0;
}

.cloud {
  position: absolute;
  z-index: 1;
  pointer-events: none;
}

.cloud--1 {
  top: 4%;
  right: -3%;
  width: 480px;
  color: rgba(74, 143, 217, 0.12);
}

.cloud--2 {
  top: 20%;
  left: -5%;
  width: 400px;
  color: rgba(212, 168, 67, 0.14);
}

.cloud--3 {
  bottom: 22%;
  right: 6%;
  width: 280px;
  color: rgba(74, 143, 217, 0.10);
}

.rays {
  position: absolute;
  top: -8%;
  right: -3%;
  width: 640px;
  height: 640px;
  z-index: 1;
  pointer-events: none;
  color: rgba(212, 168, 67, 0.22);
  opacity: 0.8;
}

.horizon {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent 0%, rgba(26, 35, 50, 0.06) 20%, rgba(26, 35, 50, 0.06) 80%, transparent 100%);
  z-index: 3;
}

.content {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 52px 64px 48px;
}

.eyebrow {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #636B78;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

h1 {
  font-family: 'Fraunces', serif;
  font-size: 88px;
  font-weight: 400;
  line-height: 1.05;
  color: #1A2332;
  margin-bottom: 18px;
  letter-spacing: -0.01em;
}

.tagline {
  font-family: 'Fraunces', serif;
  font-size: 32px;
  font-weight: 300;
  font-style: italic;
  color: #2B6AB0;
  line-height: 1.35;
  font-variation-settings: 'opsz' 48;
  max-width: 560px;
}

.footer {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}

.url {
  font-family: 'Fraunces', serif;
  font-size: 17px;
  font-weight: 400;
  font-style: italic;
  color: rgba(26, 35, 50, 0.35);
  letter-spacing: 0.01em;
}

.description {
  font-size: 15px;
  font-weight: 400;
  color: #3D4A5C;
  line-height: 1.5;
  max-width: 420px;
  text-align: right;
}
</style>
</head>
<body>

<!-- Clouds -->
<svg class="cloud cloud--1" viewBox="0 0 600 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M50 160C50 160 80 40 200 60C320 80 280 20 400 40C520 60 560 120 540 160C520 200 100 200 50 160Z" fill="currentColor"/>
  <path d="M120 170C120 170 140 80 240 95C340 110 310 65 400 80C490 95 520 140 505 170C490 200 150 195 120 170Z" fill="currentColor" opacity="0.5"/>
</svg>
<svg class="cloud cloud--2" viewBox="0 0 500 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M30 140C30 140 60 30 180 50C300 70 260 15 360 35C460 55 490 110 470 140C450 170 70 175 30 140Z" fill="currentColor"/>
</svg>
<svg class="cloud cloud--3" viewBox="0 0 400 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M20 120C20 120 45 25 140 40C235 55 210 10 290 28C370 46 395 90 380 120C365 150 50 148 20 120Z" fill="currentColor"/>
</svg>

<!-- Sun rays -->
<svg class="rays" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M800 0L400 800L350 800L800 50Z" fill="currentColor" opacity="0.6"/>
  <path d="M800 80L500 800L450 800L800 130Z" fill="currentColor" opacity="0.4"/>
  <path d="M800 180L580 800L530 800L800 230Z" fill="currentColor" opacity="0.3"/>
  <path d="M700 0L300 800L260 800L700 30Z" fill="currentColor" opacity="0.2"/>
</svg>

<div class="horizon"></div>

<div class="content">
  <div class="eyebrow">Technology sovereignty for social purpose organisations</div>

  <div class="main">
    <h1>TechFreedom</h1>
    <p class="tagline">A clearer forecast for your organisation's digital future.</p>
  </div>

  <div class="footer">
    <div class="url">techfreedom.eu</div>
    <div class="description">Helping VCSE organisations understand their technology dependencies and start making deliberate choices.</div>
  </div>
</div>

</body>
</html>
