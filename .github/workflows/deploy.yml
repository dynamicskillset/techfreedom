name: Deploy to Bunny.net
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stacktopolis/package-lock.json
      - run: cd stacktopolis && npm ci && npm run build
      - name: Replace source with build output
        run: |
          mv stacktopolis/dist stacktopolis-built
          rm -rf stacktopolis
          mv stacktopolis-built stacktopolis
      - uses: ayeressian/bunnycdn-storage-deploy@v2.2.2
        with:
          source: "."
          storageZoneName: "${{ secrets.BUNNY_STORAGE_ZONE_NAME }}"
          storagePassword: "${{ secrets.BUNNY_STORAGE_ZONE_PASSWORD }}"
          pullZoneId: "${{ secrets.BUNNY_PULL_ZONE_ID }}"
          accessKey: "${{ secrets.BUNNY_API_KEY }}"
          storageEndpoint: "uk.storage.bunnycdn.com"
          upload: "true"
          remove: "true"
          purgePullZone: "true"
